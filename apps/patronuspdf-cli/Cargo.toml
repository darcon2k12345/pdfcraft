[package]
name = "patronuspdf-cli"
description = "Patronus PDF command-line tool: inspect, render and robustness-check PDFs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "patronuspdf-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
patronuspdf-render = { workspace = true }
serde_json = { workspace = true }
patronuspdf-engine = { workspace = true }
patronuspdf-audit = { workspace = true }
patronuspdf-cos = { workspace = true }
patronuspdf-preflight = { workspace = true }
patronuspdf-automation = { workspace = true }
patronuspdf-platform = { workspace = true }
base64 = "0.23"

[dev-dependencies]
# Decodes `render` output in tests/it/owner_password.rs.
craft-image-codecs = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `geteuid` for `ui`'s control-file owner check: safe, so no `unsafe` libc call here.
# Already in Cargo.lock through the GUI crates.
rustix = { version = "1", features = ["process"] }

[build-dependencies]
# VERSIONINFO for patronuspdf-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[features]
default = ["mcp"]
# The opt-in MCP server (`patronuspdf-cli mcp`). Build with --no-default-features to leave it out.
mcp = ["patronuspdf-automation/mcp"]
