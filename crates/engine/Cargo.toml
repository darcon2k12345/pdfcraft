[package]
name = "patronuspdf-engine"
description = "Patronus PDF engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-docpath = { workspace = true }
craft-image-codecs = { workspace = true }
patronuspdf-measure = { workspace = true }
image = { version = "0.25", default-features = false }
patronuspdf-render = { workspace = true }
patronuspdf-cos = { workspace = true }
patronuspdf-organize = { workspace = true }
patronuspdf-annot = { workspace = true }
patronuspdf-forms = { workspace = true }
patronuspdf-xfa = { workspace = true }
patronuspdf-edit = { workspace = true }
patronuspdf-content = { workspace = true }
patronuspdf-audit = { workspace = true }
patronuspdf-redact = { workspace = true }
patronuspdf-print = { workspace = true }
patronuspdf-xfdf = { workspace = true }
patronuspdf-sign = { workspace = true }
patronuspdf-optimize = { workspace = true }
patronuspdf-a11y = { workspace = true }
patronuspdf-ocr = { workspace = true }
patronuspdf-js = { workspace = true }
patronuspdf-compare = { workspace = true }
patronuspdf-preflight = { workspace = true }
patronuspdf-export = { workspace = true }
patronuspdf-fonts = { workspace = true }
patronuspdf-create = { workspace = true }
patronuspdf-model = { workspace = true }
patronuspdf-geom = { workspace = true }
thiserror = { workspace = true }
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today"). The workspace
# entry is std-only; this target adds `clock` for `chrono::Local::now`.
chrono = { workspace = true, features = ["clock"] }
getrandom = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the graph (platform, automation): the rename an automation root confines is made
# below the root's open folder (rename::rooted).
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# Synthetic printer profiles for the app-managed print colour tests.
craft-cms = { workspace = true }
craft-tiff = { workspace = true }
patronuspdf-testkit = { workspace = true }
# JBIG2 fixtures (`encode_jbig2_generic`).
patronuspdf-filters = { workspace = true }
